name: SLSA Level 3 Provenance Generator

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      # ========================================================
      # Step 1: Build the Tri-Nova Sovereign Substrate Artifacts
      # ========================================================
      - name: Build Secure Artifacts
        run: |
            echo "Packaging Enterprise Core, Server, and SDK into a secure release bundle..."
            zip -r Sovereign_Substrate_Release.zip enterprise_core/ server/ plisio_sdk/ requirements.txt README.md LEAP_LAYER_ARCHITECTURE.md

      # ========================================================
      # Step 2: Generate SHA256 hashes for the artifacts
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          files=$(ls *.zip)
          
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Uploads the provenance file directly to the GitHub Release
